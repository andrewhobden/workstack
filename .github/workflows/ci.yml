name: Validate Workstack

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install chromium
      - run: npm test

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      electron-toolchain:
        patterns:
          - electron
          - electron-builder
          - '@electron/rebuild'
          - electron-vite
      vite-vitest:
        patterns:
          - vite
          - vitest
          - '@vitest/*'
          - '@vitejs/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
